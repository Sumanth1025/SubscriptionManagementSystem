{% extends "base.html" %}

{% block title %}Edit Customer{% endblock %}

{% block content %}

<h1>Edit Customer</h1>

<form method="POST">

    <div class="form-group">

        <label>Name</label>

        <input
            type="text"
            name="name"
            value="{{ customer[1] }}"
            required
        >

    </div>


    <div class="form-group">

        <label>Email</label>

        <input
            type="email"
            name="email"
            value="{{ customer[2] }}"
        >

    </div>


    <div class="form-group">

        <label>Phone</label>

        <input
            type="text"
            name="phone"
            value="{{ customer[3] }}"
        >

    </div>


    <div class="form-group">

        <label>Registration Date</label>

        <input
            type="date"
            name="registration_date"
            value="{{ customer[4] }}"
            required
        >

    </div>


    <button type="submit" class="btn">
        Update Customer
    </button>

    <a href="/customers" class="cancel-btn">
        Cancel
    </a>

</form>

{% endblock %}
