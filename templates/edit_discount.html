{% extends "base.html" %}

{% block title %}Edit Discount{% endblock %}

{% block content %}

<h1>Edit Discount</h1>

<form method="POST">

    <div class="form-group">

        <label>Discount Percentage</label>

        <input
            type="number"
            name="discount_percentage"
            value="{{ discount[2] }}"
            min="0"
            max="100"
            step="0.01"
            required
        >

    </div>


    <div class="form-group">

        <label>Valid From</label>

        <input
            type="date"
            name="valid_from"
            value="{{ discount[3] }}"
            required
        >

    </div>


    <div class="form-group">

        <label>Valid To</label>

        <input
            type="date"
            name="valid_to"
            value="{{ discount[4] }}"
            required
        >

    </div>


    <button type="submit" class="btn">
        Update Discount
    </button>

    <a href="/discounts" class="cancel-btn">
        Cancel
    </a>

</form>

{% endblock %}
