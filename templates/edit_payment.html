{% extends "base.html" %}

{% block title %}Edit Payment{% endblock %}

{% block content %}

<h1>Edit Payment</h1>

<form method="POST">

    <div class="form-group">

        <label>Amount</label>

        <input
            type="number"
            name="amount"
            value="{{ payment[2] }}"
            min="0"
            step="0.01"
            required
        >

    </div>


    <div class="form-group">

        <label>Payment Date</label>

        <input
            type="date"
            name="payment_date"
            value="{{ payment[3] }}"
            required
        >

    </div>


    <div class="form-group">

        <label>Payment Method</label>

        <select name="payment_method" required>

            <option value="cash"
                {% if payment[4] == "cash" %}selected{% endif %}>
                Cash
            </option>

            <option value="card"
                {% if payment[4] == "card" %}selected{% endif %}>
                Card
            </option>

            <option value="upi"
                {% if payment[4] == "upi" %}selected{% endif %}>
                UPI
            </option>

            <option value="bank transfer"
                {% if payment[4] == "bank transfer" %}selected{% endif %}>
                Bank Transfer
            </option>

        </select>

    </div>


    <div class="form-group">

        <label>Status</label>

        <select name="status" required>

            <option value="completed"
                {% if payment[5] == "completed" %}selected{% endif %}>
                Completed
            </option>

            <option value="pending"
                {% if payment[5] == "pending" %}selected{% endif %}>
                Pending
            </option>

            <option value="failed"
                {% if payment[5] == "failed" %}selected{% endif %}>
                Failed
            </option>

        </select>

    </div>


    <button type="submit" class="btn">
        Update Payment
    </button>

    <a href="/payments" class="cancel-btn">
        Cancel
    </a>

</form>

{% endblock %}
