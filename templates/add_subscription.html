{% extends "base.html" %}

{% block title %}Create Subscription{% endblock %}

{% block content %}

<h1>Create Subscription</h1>

<form method="POST" action="/add-subscription">

    <div class="form-group">

        <label>Customer</label>

        <select name="customer_id" required>

            <option value="">Select Customer</option>

            {% for customer in customers %}

            <option value="{{ customer[0] }}">
                {{ customer[1] }}
            </option>

            {% endfor %}

        </select>

    </div>


    <div class="form-group">

        <label>Plan</label>

        <select name="plan_id" required>

            <option value="">Select Plan</option>

            {% for plan in plans %}

            <option value="{{ plan[0] }}">
                {{ plan[1] }} - ₹{{ plan[2] }} - {{ plan[3] }} month(s)
            </option>

            {% endfor %}

        </select>

    </div>


    <div class="form-group">

        <label>Start Date</label>

        <input
            type="date"
            name="start_date"
            required
        >

    </div>


    <button type="submit" class="btn">
        Create Subscription
    </button>

    <a href="/subscriptions" class="cancel-btn">
        Cancel
    </a>

</form>

{% endblock %}
