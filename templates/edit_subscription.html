{% extends "base.html" %}

{% block title %}Edit Subscription{% endblock %}

{% block content %}

<h1>Edit Subscription</h1>

<form method="POST">

    <div class="form-group">

        <label>Customer</label>

        <select name="customer_id" required>

            {% for customer in customers %}

            <option
                value="{{ customer[0] }}"
                {% if customer[0] == subscription[1] %}selected{% endif %}
            >
                {{ customer[1] }}
            </option>

            {% endfor %}

        </select>

    </div>


    <div class="form-group">

        <label>Plan</label>

        <select name="plan_id" required>

            {% for plan in plans %}

            <option
                value="{{ plan[0] }}"
                {% if plan[0] == subscription[2] %}selected{% endif %}
            >
                {{ plan[1] }}
            </option>

            {% endfor %}

        </select>

    </div>


    <div class="form-group">

        <label>Start Date</label>

        <input
            type="date"
            name="start_date"
            value="{{ subscription[3] }}"
            required
        >

    </div>


    <div class="form-group">

        <label>End Date</label>

        <input
            type="date"
            name="end_date"
            value="{{ subscription[4] }}"
            required
        >

    </div>


    <div class="form-group">

        <label>Status</label>

        <select name="status" required>

            <option value="active"
                {% if subscription[5] == "active" %}selected{% endif %}>
                Active
            </option>

            <option value="expired"
                {% if subscription[5] == "expired" %}selected{% endif %}>
                Expired
            </option>

            <option value="cancelled"
                {% if subscription[5] == "cancelled" %}selected{% endif %}>
                Cancelled
            </option>

        </select>

    </div>


    <button type="submit" class="btn">
        Update Subscription
    </button>

    <a href="/subscriptions" class="cancel-btn">
        Cancel
    </a>

</form>

{% endblock %}
