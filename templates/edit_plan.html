{% extends "base.html" %}

{% block title %}Edit Plan{% endblock %}

{% block content %}

<h1>Edit Plan</h1>

<form method="POST">

    <div class="form-group">

        <label>Plan Name</label>

        <input
            type="text"
            name="plan_name"
            value="{{ plan[1] }}"
            required
        >

    </div>


    <div class="form-group">

        <label>Price</label>

        <input
            type="number"
            name="price"
            value="{{ plan[2] }}"
            min="0"
            step="0.01"
            required
        >

    </div>


    <div class="form-group">

        <label>Duration (Months)</label>

        <input
            type="number"
            name="duration_months"
            value="{{ plan[3] }}"
            min="1"
            required
        >

    </div>


    <div class="form-group">

        <label>Description</label>

        <input
            type="text"
            name="description"
            value="{{ plan[4] }}"
        >

    </div>


    <button type="submit" class="btn">
        Update Plan
    </button>

    <a href="/plans" class="cancel-btn">
        Cancel
    </a>

</form>

{% endblock %}
