{% extends "base.html" %}

{% block title %}Add Discount{% endblock %}

{% block content %}

<h1>Add Discount</h1>

<form method="POST" action="/add-discount">

    <div class="form-group">

        <label>Plan</label>

        <select name="plan_id" required>

            <option value="">Select Plan</option>

            {% for plan in plans %}

            <option value="{{ plan[0] }}">
                {{ plan[1] }} - ₹{{ plan[2] }}
            </option>

            {% endfor %}

        </select>

    </div>


    <div class="form-group">

        <label>Discount Percentage</label>

        <input
            type="number"
            name="discount_percentage"
            min="0"
            max="100"
            step="0.01"
            placeholder="Enter discount percentage"
            required
        >

    </div>


    <div class="form-group">

        <label>Valid From</label>

        <input
            type="date"
            name="valid_from"
            required
        >

    </div>


    <div class="form-group">

        <label>Valid To</label>

        <input
            type="date"
            name="valid_to"
            required
        >

    </div>


    <button type="submit" class="btn">
        Add Discount
    </button>

    <a href="/discounts" class="cancel-btn">
        Cancel
    </a>

</form>

{% endblock %}
